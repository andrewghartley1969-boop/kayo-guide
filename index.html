<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kayo Guide</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kayo Guide">
<meta name="theme-color" content="#0c161c">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#0c161c; --panel:#242d33; --panel-2:#1b2326; --line:#3d4549;
  --fg:#f9fafa; --muted:#b3b9bb; --accent:#40f87f; --accent-ink:#0c161c;
  --live:#d12424; --past:#6d7377; --now-tint:#0e251d; color-scheme:dark;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
  --px-per-min:5px; --row-h:76px; --label-w:112px;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:14px 10px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line);background:var(--bg)}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.01em;margin:0;line-height:1;text-transform:uppercase}
h1 span{color:var(--accent)}
.clock{font-family:var(--f-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.spacer{flex:1}
.updated{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:600 15px var(--f-body);border:1px solid transparent;background:var(--panel);color:var(--fg);padding:8px 14px;border-radius:999px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#refresh{background:var(--accent);color:var(--accent-ink)}#refresh:disabled{opacity:.6}
.tab:focus-visible,.prog:focus-visible,.nowcard:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.views{display:flex;gap:6px}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.nowcard{flex:0 0 220px;background:var(--panel);border:1px solid transparent;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.nowcard .ch{font:600 13px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center}
.nowcard .t{font-weight:600;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nowcard .next{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:3px;background:var(--panel-2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
main{flex:1;min-height:0;position:relative}
.grid{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
.canvas{position:relative}
.ruler{position:sticky;top:0;z-index:4;height:32px;background:var(--bg);border-bottom:1px solid var(--line)}
.tick{position:absolute;top:0;height:100%;border-left:1px solid var(--line);padding:8px 0 0 6px;font:600 14px var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.row{position:relative;height:var(--row-h);border-bottom:1px solid var(--line)}
.label{position:sticky;left:0;z-index:3;width:var(--label-w);height:100%;background:var(--bg);display:flex;flex-direction:column;justify-content:center;gap:2px;padding-left:max(12px,env(safe-area-inset-left,0px));border-right:1px solid var(--line)}
.label b{font:700 17px var(--f-display);text-transform:uppercase;line-height:1.05}
.logo{display:flex;align-items:center;justify-content:center;width:84px;height:62px}.logo img{max-width:100%;max-height:100%;object-fit:contain;display:block}.logo.sm{width:44px;height:36px}.logo.xs{width:30px;height:24px;margin:-4px 0}
.label small{font:600 12px var(--f-display);color:var(--muted);letter-spacing:.08em}
.corner{position:sticky;left:0;z-index:5;width:var(--label-w);height:100%;background:var(--bg);border-right:1px solid var(--line)}
.prog{position:absolute;top:5px;bottom:5px;background:var(--panel);border:1px solid transparent;border-radius:7px;padding:7px 9px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:3px;text-align:left;color:inherit;font:inherit}
.prog .t{font-weight:600;font-size:13.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog .c{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog .tm{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.prog.past{opacity:.55}
.prog.on{background:var(--now-tint);border-color:var(--accent);border-width:2px}
.live{display:inline-block;font:700 10.5px var(--f-body);letter-spacing:.06em;background:var(--live);color:#fff;border-radius:3px;padding:1px 4px;vertical-align:1px;margin-right:4px}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--live);z-index:2;pointer-events:none}
.nowline::before{content:"";position:absolute;top:26px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--live)}
.list{position:absolute;inset:0;overflow:auto;padding-block:14px 30px}
.list section{max-width:820px;margin:0 auto 22px}
.list h2{font:700 20px var(--f-display);text-transform:uppercase;margin:0 0 8px;display:flex;gap:8px;align-items:baseline}
.list h2 small{font-size:14px;color:var(--muted);letter-spacing:.06em}
.li{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.li .tm{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13.5px}
.li .t{font-weight:600;min-width:0}
.li .c{font-size:13px;color:var(--muted)}
.li.on .tm{color:var(--accent);font-weight:600}
.li.past{opacity:.5}
.sheet{position:fixed;inset:0;z-index:20;background:rgb(0 0 0 / .45);display:flex;align-items:flex-end;justify-content:center}
.sheet .card{background:var(--panel);color:var(--fg);width:min(560px,100%);border-radius:16px 16px 0 0;padding:22px max(20px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.sheet .ch{font:600 14px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sheet h3{font:700 26px var(--f-display);margin:0;line-height:1.1;text-wrap:balance}
.sheet .comp{color:var(--accent);font-weight:600}
.sheet .when{font-variant-numeric:tabular-nums}
.sheet button{align-self:flex-start;font:600 15px var(--f-body);background:var(--panel-2);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:9px 18px;cursor:pointer;margin-top:6px}
.note{font-size:12px;color:var(--muted);padding-block:6px}
@media (max-width:600px){:root{--label-w:84px;--px-per-min:4px}.label .logo{width:64px;height:48px}.nowcard{flex-basis:180px}h1{font-size:24px}}
</style>
</head>
<body>
<header class="wrap">
  <div class="top">
    <h1>Kayo <span>Guide</span></h1>
    <div class="clock" id="clock"></div>
    <div class="spacer"></div>
    <button class="tab" id="refresh">Refresh</button>
    <div class="views tabs" role="group" aria-label="View">
      <button class="tab" id="v-grid" aria-pressed="true">Grid</button>
      <button class="tab" id="v-list" aria-pressed="false">By channel</button>
    </div>
  </div>
  <div class="tabs" id="days" role="group" aria-label="Day"></div>
  <div class="strip" id="strip" aria-label="On now"></div>
  <div class="updated" id="updated"></div>
</header>
<main>
  <div class="grid" id="grid"><div class="canvas" id="canvas"></div></div>
  <div class="list wrap" id="list" hidden></div>
</main>
<div class="sheet" id="sheet" hidden><div class="card" role="dialog" aria-modal="true" aria-labelledby="s-title">
  <div class="ch" id="s-ch"></div><h3 id="s-title"></h3><div class="comp" id="s-comp"></div><div class="when" id="s-when"></div>
  <button id="s-close">Close</button></div></div>
<script src="guide-data.js?v=9"></script>
<script src="app.js?v=9"></script>
</body>
</html>
