name: login-test
on: [workflow_dispatch]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        env:
          OTV_EMAIL: ${{ secrets.OTV_EMAIL }}
          OTV_PASSWORD: ${{ secrets.OTV_PASSWORD }}
        run: |
          UA="Mozilla/5.0 (Macintosh) Safari/605.1.15"
          B=https://www.ontvtonight.com
          [ -z "$OTV_EMAIL" ] && echo "== secrets missing" && exit 1
          curl -s --compressed -c cj -b cj -A "$UA" $B/au/user/login -o l.html
          T=$(grep -oE 'name="_token" value="[^"]+"' l.html | head -1 | cut -d'"' -f4)
          curl -s --compressed -L -c cj -b cj -A "$UA" -o r.html -w '== login %{http_code} %{url_effective}\n' \
            --data-urlencode "_token=$T" --data-urlencode "email=$OTV_EMAIL" --data-urlencode "password=$OTV_PASSWORD" $B/au/user/dologin
          grep -q 'Sign out\|Logout\|logout' r.html && echo "== signed in" || echo "== NOT signed in"
          curl -s --compressed -L -c cj -b cj -A "$UA" -o ch.html $B/au/user/channels
          echo "== my channel links:"; grep -oE '/au/guide/listings/channel/[0-9]+/[a-z0-9-]+\.html' ch.html | sort -u | grep -iE 'fox|espn|racing' | head -40
          for u in "/au/guide/" "/au/guide/listings/MelbourneNight.html" "/au/guide/listings/channel/3181/fox-league-hd.html" "/au/user/channels"; do
            curl -s --compressed -L -c cj -b cj -A "$UA" -o p.html "$B$u"
            echo "== PAGE $u $(wc -c < p.html)"
            sed 's/<[^>]*>/ /g' p.html | tr -s ' \n' ' ' | grep -oiE '.{0,150}(fox league|fox footy|nrl 360|empty|no schedule).{0,250}' | head -4
            grep -oE '(fetch|axios|ajax|url)[^;]{0,120}(api|json|listing)[^;]{0,80}' p.html | sort -u | head -5
          done
